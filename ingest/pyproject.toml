[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mjs-ingest"
version = "0.1.0"
description = "Ingest dan validasi SITREP MJ-Sentinel untuk dashboard sitrep-matajaga"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Inti paket stdlib murni. Dependensi di bawah hanya untuk jalur yang
# memerlukannya, agar validasi doktrin dapat berjalan di mana saja.
docx = ["python-docx>=1.1"]
schema = ["jsonschema>=4.21"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
mjs-ingest = "mjs_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
